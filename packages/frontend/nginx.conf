server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Serve real assets normally. Missing extensionless paths are handled
    # by the SPA entry point through an internal rewrite (no client redirect).
    # Note that this path isn't actually active normally, because k8s should
    # send such traffic to the preview server.
    # Handle the root explicitly: it has no final path component, so it does
    # not match the extensionless-path rewrite below.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri @extensionless;
    }

    location @extensionless {
        # Match paths whose final component has no file extension. Parent path
        # components may contain dots.
        rewrite ^/(?:.*/)?[^/.]+/?$ /index.html last;
        return 404;
    }
}
